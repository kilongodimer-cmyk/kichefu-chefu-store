<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Devenir Vendeur | KICHEFU-CHEFU STORE</title>
  <style>
    :root{--bg:#0d1218;--panel:#151d27;--line:#2b3645;--text:#f5f8ff;--muted:#aab6c8;--accent:#79d2a6;--gold:#d4a843;--red:#e74c3c}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(180deg,#0d1218,#101824);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .form-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:100%;max-width:440px;margin:24px}
    h1{font-size:1.3rem;font-weight:700;color:var(--gold);margin-bottom:6px}
    .sub{color:var(--muted);font-size:.85rem;margin-bottom:22px}
    label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;margin-top:14px}
    input,select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#1a2332;color:var(--text);font-size:.9rem}
    input:focus,select:focus{outline:none;border-color:var(--accent)}
    .error{background:rgba(231,76,60,.12);color:var(--red);padding:10px 14px;border-radius:8px;font-size:.84rem;margin-bottom:12px}
    .btn{display:block;width:100%;padding:12px;margin-top:22px;border:none;border-radius:8px;background:var(--accent);color:#000;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s}
    .btn:hover{background:#5ec492}
    .link{text-align:center;margin-top:14px;font-size:.82rem}
    .link a{color:var(--accent)}
  </style>
</head>
<body>
  <div class="form-box">
    <h1>&#x1F91D; Devenir Vendeur</h1>
    <p class="sub">Inscrivez-vous pour vendre vos produits sur KICHEFU-CHEFU STORE et gagner de l'argent. Commission de 5%.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="seller_type">Type de vendeur</label>
      <select name="seller_type" id="seller_type">
        <option value="individual">Particulier</option>
        <option value="dealer">Dealer / Professionnel</option>
      </select>

      <label for="business_name">Nom commercial (optionnel)</label>
      <input type="text" name="business_name" id="business_name" placeholder="Ex: Auto Plus Congo" maxlength="120"/>

      <label for="phone">Numero de telephone *</label>
      <input type="tel" name="phone" id="phone" placeholder="+243..." required maxlength="30"/>

      <label for="city">Ville</label>
      <input type="text" name="city" id="city" placeholder="Lubumbashi" maxlength="80"/>

      <button type="submit" class="btn">Creer mon profil vendeur</button>
    </form>
    <p class="link"><a href="{% url 'home' %}">&larr; Retour au site</a></p>
  </div>
</body>
</html>
